[package]
name = "agent-clip"
version = "0.2.0"
edition = "2021"
description = "Shared clipboard of shell commands that AI agents hand to the user"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
